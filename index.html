<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151714" />
    <title>Incremental Québécois</title>
  </head>
  <body>
    <main id="app">
      <section id="ecran" class="ecran" aria-label="Ton rang">
        <div id="scan" class="scan"></div>
        <div class="hud">
          <p id="job" class="job">RAMASSER DES CANETTES</p>
          <p id="cash" class="cash">0,00 $</p>
          <p id="rate" class="rate">+0,00 $/s</p>
          <p id="rep" class="rep" hidden></p>
        </div>
        <button id="vhs" class="vhs" type="button" aria-pressed="true">VHS</button>
      </section>

      <button id="tap" class="tap" type="button">
        <span id="tap-label">[ RAMASSER ]</span>
        <span id="tap-value" class="tap-value">+0,10 $</span>
      </button>

      <section id="quest" class="quest" aria-live="polite">
        <div id="q-portrait" class="portrait" aria-hidden="true"></div>
        <div class="quest-body">
          <p id="q-who" class="quest-who"></p>
          <p id="q-line" class="quest-line"></p>
          <div class="bar"><div id="q-bar" class="bar-fill"></div></div>
          <div class="quest-foot">
            <span id="q-goal"></span>
            <span id="q-reward" class="quest-reward"></span>
          </div>
          <button id="q-claim" class="buy-car" type="button" hidden>[ RÉCLAMER ]</button>
        </div>
      </section>

      <section id="goal" class="goal">
        <div class="goal-label">
          <span>PROCHAIN : TON PREMIER BAZOU</span>
          <span id="goal-text"></span>
        </div>
        <div class="bar"><div id="goal-bar" class="bar-fill"></div></div>
        <button id="buy-car" class="buy-car" type="button" hidden>[ ACHETER LE BAZOU ]</button>
      </section>

      <section id="garage" class="garage" hidden>
        <div class="garage-head">
          <h2>TON BAZOU</h2>
          <span id="car-status" class="car-status"></span>
        </div>
        <ul id="parts" class="upgrades"></ul>
      </section>

      <section id="empire" class="garage" hidden>
        <h2>TON EMPIRE</h2>
        <ul class="upgrades">
          <li id="bat" class="upgrade">
            <div class="upgrade-info">
              <strong id="bat-name"></strong>
              <small id="bat-desc"></small>
            </div>
            <button id="bat-buy" type="button" class="buy"><span id="bat-cost"></span></button>
          </li>
          <li id="prestige" class="upgrade prestige" hidden>
            <div class="upgrade-info">
              <strong>Vendre l'empire</strong>
              <small id="prestige-desc"></small>
            </div>
            <button id="prestige-btn" type="button" class="buy">VENDRE</button>
          </li>
        </ul>
      </section>

      <section>
        <h2>ACHATS</h2>
        <ul id="upgrades" class="upgrades"></ul>
      </section>

      <footer class="foot">
        <button id="reset" type="button" class="link">Recommencer à zéro</button>
      </footer>
    </main>

    <dialog id="message">
      <p id="message-text"></p>
      <form method="dialog"><button type="submit">[ ENVOYE DONC ]</button></form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
